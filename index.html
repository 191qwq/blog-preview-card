<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./index.css">

  <title>Frontend Mentor | Blog preview card</title>

  <style>
  </style>
</head>

<body>
<main class="page">
  <article class="card">
    <img class="card__illustration" src="./assets/images/illustration-article.svg" alt="">
    <div class="card__content">
      <span class="card__badge">Learning</span>
      <p class="card__date">Published 21 Dec 2023</p>
      <h1 class="card__title">
        <a href="#">HTML & CSS foundations</a>
      </h1>
      <p class="card__description">
        These languages are the backbone of every website, defining structure, content, and presentation.
      </p>
    </div>
    <footer class="card__author">
      <img class="card__avatar" src="./assets/images/image-avatar.webp" alt="Portrait of Greg Hooper">
      <span class="card__author-name">Greg Hooper</span>
    </footer>
  </article>
</main>
</body>

</html>
